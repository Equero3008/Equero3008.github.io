<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt — Enrico Kleffmann</title>
    <meta name="description" content="Contact Enrico Kleffmann. Kontaktieren Sie Enrico Kleffmann.">
    <meta name="author" content="Enrico Kleffmann">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js" defer></script>
    <span data-i18n-title="contact.title" hidden></span>
</head>
<body>
    <div class="scroll-progress"></div>

    <header class="topbar">
        <a href="index.html" class="brand">Enrico&nbsp;Kleffmann</a>
        <nav>
            <a href="index.html" data-i18n="contact.back">← Zurück</a>
            <a href="cv.html" data-i18n="nav.cv">Lebenslauf</a>
            <a href="projects.html" data-i18n="nav.projects">Projekte</a>
        </nav>
        <div class="controls">
            <button id="langToggle" class="lang-toggle" aria-label="Switch language">EN</button>
        </div>
    </header>

    <header class="reveal">
        <h1 data-i18n="contact.h">Kontakt</h1>
        <p class="lead" data-i18n="contact.lead">Ich freue mich über Nachrichten zu Projekten, Kollaborationen oder einfach zum Austausch.</p>
    </header>

    <main class="contact-container reveal s1">
        <form action="https://formsubmit.co/business.enrico.kleffmann@gmail.com" method="POST">

            <input type="text" name="_honey" style="display:none">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://enrico-kleffmann.com/contact.html">

            <div class="form-group">
                <label for="name" data-i18n="contact.name">Name</label>
                <input type="text" id="name" name="name" required data-i18n-ph="contact.name.ph" placeholder="Dein Name">
            </div>

            <div class="form-group">
                <label for="email" data-i18n="contact.email">E-Mail</label>
                <input type="email" id="email" name="email" required data-i18n-ph="contact.email.ph" placeholder="deine@email.com">
            </div>

            <div class="form-group">
                <label for="message" data-i18n="contact.msg">Nachricht</label>
                <textarea id="message" name="message" required data-i18n-ph="contact.msg.ph" placeholder="Schreib hier deine Nachricht …"></textarea>
            </div>

            <button type="submit" data-i18n="contact.send">Nachricht senden</button>
        </form>

        <div class="socials">
            <a class="social-link" href="https://github.com/Equero3008" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 .9 2.8.6 3.4.3.1-.7.4-1.2.7-1.5-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
                GitHub
            </a>
            <a class="social-link" href="https://www.linkedin.com/in/enrico-kleffmann" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg>
                LinkedIn
            </a>
            <a class="social-link" href="mailto:business.enrico.kleffmann@gmail.com">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h20a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm10 7L3.3 5.5 12 11l8.7-5.5L12 11z"/></svg>
                E-Mail
            </a>
        </div>
    </main>

    <footer>
        <span class="label" data-i18n="footer.tagline">Physik-Student · Embedded · Maker</span>
        <span>© 2026 Enrico Kleffmann</span>
    </footer>

</body>
</html>
